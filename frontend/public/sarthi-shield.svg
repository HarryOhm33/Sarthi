<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Shield Body -->
  <path d="M24 3 L39 8.5 C39 23 33 36 24 44 C15 36 9 23 9 8.5 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#shadow)" />

  <!-- Inner Soft Bevel Highlight -->
  <path d="M24 5.5 L36.5 10.2 C36.5 22.5 31.5 33.5 24 40.5 C16.5 33.5 11.5 22.5 11.5 10.2 Z" 
        fill="url(#innerGlow)" />

  <!-- Central Empathy & Legal Defense Emblem -->
  <!-- Stylized Winged S / Scales / Defense Star -->
  <path d="M24 13 L27 20 L34 21 L28.5 26 L30.5 33 L24 29 L17.5 33 L19.5 26 L14 21 L21 20 Z" 
        fill="url(#goldGrad)" 
        stroke="#ffffff" 
        stroke-width="0.8" 
        stroke-linejoin="round" />

  <!-- Center Core Dot -->
  <circle cx="24" cy="24" r="2.2" fill="#ffffff" />
</svg>
